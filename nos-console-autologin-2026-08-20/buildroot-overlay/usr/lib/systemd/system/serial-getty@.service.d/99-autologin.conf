# MOXA-DEV-AUTOLOGIN - development images only, remove before release
# Passwordless root autologin on the serial console.
#
# The empty ExecStart= is mandatory: ExecStart accumulates, and without the
# reset two agetty processes fight over the tty.
#
# This lives under /usr/lib (not /lib) because the target uses merged /usr
# (/lib -> usr/lib) and support/scripts/check-merged-usr.sh fails the build
# on an overlay containing a bare lib/.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 %I $TERM
